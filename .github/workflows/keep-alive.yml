name: Keep-alive

# Render free web services sleep after 15 minutes idle. Pinging /health every 10 minutes keeps the
# API (and its DB connection) warm. Set the repository variable BACKEND_URL to enable it.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping backend /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::BACKEND_URL repository variable is not set; skipping keep-alive ping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${BACKEND_URL%/}/health"
